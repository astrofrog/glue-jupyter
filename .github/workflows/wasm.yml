name: wasm-tests

on:
  push:
  pull_request:

jobs:
  test-wasm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v1
        with:
          init-shell: bash
          create-args: ""   # IMPORTANT: prevent auto env creation

      - name: Create wasm environment
        shell: bash -l {0}
        run: |
          micromamba create -y -n wasm-env \
            --platform emscripten-wasm32 \
            -c emscripten-forge -c conda-forge \
            python nodejs pytest pip

      - name: Activate environment
        run: |
          eval "$(micromamba shell hook --shell bash)"
          micromamba activate wasm-env
          python -V

      - name: Build wheel
        run: |
          eval "$(micromamba shell hook --shell bash)"
          micromamba activate wasm-env
          pip wheel . -w dist

      - name: Install wheel
        run: |
          eval "$(micromamba shell hook --shell bash)"
          micromamba activate wasm-env
          pip install dist/*.whl

      - name: Test installed package
        run: |
          eval "$(micromamba shell hook --shell bash)"
          micromamba activate wasm-env
          pytest --pyargs your_package
