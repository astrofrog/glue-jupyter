name: wasm-tests

on:
  push:
  pull_request:

jobs:
  test-wasm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: wasm-env
          conda-platform: emscripten-wasm32
          create-args: >
            python
            emscripten
            compilers
            nodejs
            -c conda-forge
            -c emscripten-forge

      - name: Activate environment
        run: |
          eval "$(micromamba shell hook --shell bash)"
          micromamba activate wasm-env
          python -V

      - name: Build wheel
        run: |
          eval "$(micromamba shell hook --shell bash)"
          micromamba activate wasm-env
          pip wheel . -w dist

      - name: Install wheel
        run: |
          eval "$(micromamba shell hook --shell bash)"
          micromamba activate wasm-env
          pip install dist/*.whl

      - name: Test installed package
        run: |
          eval "$(micromamba shell hook --shell bash)"
          micromamba activate wasm-env
          pytest --pyargs your_package
